<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Redirecting - E-Learning Platform</title>
    <script>
        (function() {
            const token = localStorage.getItem('elearning_token');
            const role = localStorage.getItem('elearning_role');

            if (token && role) {
                if (role === 'siswa') {
                    window.location.href = '/pages/siswa/dashboard.html';
                } else if (role === 'guru') {
                    window.location.href = '/pages/guru/dashboard.html';
                } else if (role === 'admin') {
                    window.location.href = '/pages/admin/dashboard.html';
                } else {
                    window.location.href = '/login.html';
                }
            } else {
                window.location.href = '/login.html';
            }
        })();
    </script>
</head>
<body>
    <div style="font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #888888;">
        Memuat alur masuk sistem...
    </div>
</body>
</html>
