<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Guru - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/admin/admin-common.css">
    <link rel="stylesheet" href="../../src/css/admin/guru.css">
</head>
<body class="admin-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1>Kelola Pengajar (Guru)</h1>
                    <p>Manajemen data pengajar, informasi mata pelajaran, dan kontak guru.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=admin" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Admin</span>
                        <p id="user-display-role">ADMINISTRATOR</p>
                    </div>
                </div>
            </header>

            <!-- Controls: Search & Add -->
            <section class="controls-row">
                <div class="search-wrapper">
                    <!-- Search Icon SVG -->
                    <svg class="search-icon-svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-guru" class="search-input" placeholder="Cari nama guru atau mata pelajaran...">
                </div>
                <button id="btn-tambah-guru" class="btn-admin" style="display: flex; align-items: center; gap: 8px;">
                    <svg style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5;" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Tambah Guru Baru
                </button>
            </section>

            <!-- Teachers List Table Container -->
            <div class="teachers-table-container">
                <table class="teachers-table">
                    <thead>
                        <tr>
                            <th>Nama Pengajar</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>No. Telepon</th>
                            <th>Mata Pelajaran</th>
                            <th style="text-align: right;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="teachers-list-feed">
                        <!-- Loaded dynamically -->
                        <tr>
                            <td colspan="6" class="empty-state">Memuat data pengajar...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Form Tambah Guru -->
    <div id="modal-guru" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Tambah Guru Baru</h3>
                <button id="modal-guru-close" class="modal-close">&times;</button>
            </div>
            <form id="form-tambah-guru">
                <div class="form-group">
                    <label class="form-label" for="guru-name">Nama Lengkap</label>
                    <input class="form-input" type="text" id="guru-name" placeholder="Contoh: Bu Nina" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="guru-username">Username</label>
                    <input class="form-input" type="text" id="guru-username" placeholder="Contoh: nina" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="guru-email">Email</label>
                    <input class="form-input" type="email" id="guru-email" placeholder="Contoh: nina@guru.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="guru-phone">Nomor Telepon</label>
                    <input class="form-input" type="tel" id="guru-phone" placeholder="Contoh: 081234567890" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="guru-subject">Mata Pelajaran</label>
                    <input class="form-input" type="text" id="guru-subject" placeholder="Contoh: Matematika" required>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
                    <button type="button" id="btn-cancel-guru" class="btn-outline">Batal</button>
                    <button type="submit" class="btn-admin">Simpan Pengajar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/admin/guru.js"></script>
</body>
</html>
