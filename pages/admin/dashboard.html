<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <!-- <script src="../../src/js/middleware/auth-guard.js"></script> -->

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/admin/admin-common.css">
    <link rel="stylesheet" href="../../src/css/admin/dashboard.css">
</head>

<body class="admin-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button class="icon-btn" id="btn-toggle-menu" title="Menu">
                        <svg class="icon-btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="10" y1="6" x2="21" y2="6"></line>
                            <line x1="10" y1="12" x2="21" y2="12"></line>
                            <line x1="10" y1="18" x2="21" y2="18"></line>
                            <path d="M6 8l-4 4 4 4" />
                        </svg>
                    </button>
                    <h1 class="page-title-text" style="font-size: 1.5rem; font-weight: 800; color: #111827; margin: 0;">Dashboard</h1>
                </div>
                <div class="top-bar-actions">
                    <div class="search-wrapper" style="margin-bottom: 0;">
                        <svg class="search-icon-svg" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" class="search-input" placeholder="Cari di dashboard...">
                    </div>
                    <button class="icon-btn" title="Notifikasi">
                        <svg class="icon-btn-svg" viewBox="0 0 24 24">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                    </button>
                    <button class="icon-btn" title="Bantuan">
                        <svg class="icon-btn-svg" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </button>
                    <div class="divider-vertical"></div>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=admin_avatar" alt="Avatar" class="user-avatar-img">
                </div>
            </header>

            <div class="welcome-header">
                <h1 id="welcome-title">Dashboard Admin E-Learning Sekolah Kita</h1>
                <p id="welcome-subtitle">Selamat datang kembali, berikut ringkasan performa hari ini.</p>
            </div>

            <!-- Stats Ringkasan Grid -->
            <section class="stats-grid">
                <!-- Card 1: Total Guru -->
                <div class="stat-card" onclick="window.location.href='manajemen-pengguna.html'" style="cursor: pointer;">
                    <div class="card-header-row">
                        <div class="stat-icon">
                            <svg class="stat-icon-svg" viewBox="0 0 24 24">
                                <path d="M17 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                                <path d="M21 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </div>
                        <span class="stat-badge badge-green" id="stat-teachers-badge">+2.5%</span>
                    </div>
                    <span class="stat-label">Total Guru</span>
                    <span class="stat-value" id="stat-teachers-count">145</span>
                </div>

                <!-- Card 2: Total Siswa -->
                <div class="stat-card">
                    <div class="card-header-row">
                        <div class="stat-icon">
                            <svg class="stat-icon-svg" viewBox="0 0 24 24">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                            </svg>
                        </div>
                        <span class="stat-badge badge-green" id="stat-students-badge">+5.1%</span>
                    </div>
                    <span class="stat-label">Total Siswa</span>
                    <span class="stat-value" id="stat-students-count">2,130</span>
                </div>

                <!-- Card 3: Kursus Aktif -->
                <div class="stat-card">
                    <div class="card-header-row">
                        <div class="stat-icon">
                            <svg class="stat-icon-svg" viewBox="0 0 24 24">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                            </svg>
                        </div>
                        <span class="stat-badge badge-green" id="stat-classes-badge">+8 Aktif</span>
                    </div>
                    <span class="stat-label">Kursus Aktif</span>
                    <span class="stat-value" id="stat-classes-count">88</span>
                </div>

                <!-- Card 4: Siswa Baru (Bulan Ini) -->
                <div class="stat-card blue-card">
                    <div class="card-header-row">
                        <div class="stat-icon">
                            <svg class="stat-icon-svg" viewBox="0 0 24 24">
                                <path d="M23 6l-9.5 9.5-5-5L1 18" />
                                <path d="M17 6h6v6" />
                            </svg>
                        </div>
                        <span class="stat-badge" id="stat-new-students-badge">Target 95%</span>
                    </div>
                    <span class="stat-label">Siswa Baru (Bulan Ini)</span>
                    <span class="stat-value" id="stat-new-students-count">+110</span>
                </div>
            </section>

            <!-- Floating Action Button -->
            <button class="fab-btn" id="fab-add-data" title="Tambah Data">+</button>
        </main>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/admin/dashboard.js"></script>
</body>

</html>
