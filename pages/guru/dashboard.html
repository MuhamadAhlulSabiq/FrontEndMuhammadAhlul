<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/guru/guru-common.css">
    <link rel="stylesheet" href="../../src/css/guru/dashboard.css">
</head>
<body class="guru-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 id="welcome-title">Halo, Bu Nina!</h1>
                    <p id="welcome-subtitle">Kelola pembelajaran kelas Anda hari ini.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=guru_nina" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Bu Nina</span>
                        <p id="user-display-role">GURU</p>
                    </div>
                </div>
            </header>

            <!-- Stats Ringkasan Grid -->
            <h2 class="section-title">Ringkasan Aktivitas</h2>
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <!-- Book/Class icon -->
                        <svg class="stat-icon-svg" viewBox="0 0 24 24">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                    </div>
                    <div class="stat-details">
                        <p>Kelas Diampu</p>
                        <h3 id="stat-kelas-count">1</h3>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <!-- Students/Users icon -->
                        <svg class="stat-icon-svg" viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stat-details">
                        <p>Total Siswa</p>
                        <h3 id="stat-siswa-count">15</h3>
                    </div>
                </div>
                <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='materi.html'">
                    <div class="stat-icon">
                        <!-- Materials/Files icon -->
                        <svg class="stat-icon-svg" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M8 16V8l4 4 4-4v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                    </div>
                    <div class="stat-details">
                        <p>Materi Diunggah</p>
                        <h3 id="stat-materi-count">0</h3>
                    </div>
                </div>
                <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='tugas.html'">
                    <div class="stat-icon">
                        <!-- Tasks/Assignments icon -->
                        <svg class="stat-icon-svg" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M16 2v4M8 2v4M12 11h4M8 11h2M12 15h4M8 15h2"/>
                        </svg>
                    </div>
                    <div class="stat-details">
                        <p>Tugas Dibuat</p>
                        <h3 id="stat-tugas-count">0</h3>
                    </div>
                </div>
            </section>

            <!-- Activity Logs Section -->
            <div style="max-width: 900px;">
                <h2 class="section-title">Aktivitas Kelas Terbaru</h2>
                <div id="class-activities" class="activity-list">
                    <div class="empty-state">Memuat aktivitas kelas...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/guru/dashboard.js"></script>
</body>
</html>
