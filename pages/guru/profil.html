<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/guru/guru-common.css">
    <link rel="stylesheet" href="../../src/css/guru/profil.css">
</head>

<body class="guru-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1>Profil Saya</h1>
                    <p>Kelola detail informasi profil akademis Anda.</p>
                </div>
            </header>

            <!-- Profil View Card -->
            <section style="max-width: 720px; animation: fadeIn 0.4s ease;">
                <div class="profile-avatar-container">
                    <img id="profile-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=guru_nina"
                        alt="User Profile Image" class="profile-avatar-large" style="background-color: #DEEEFF;">
                    <div>
                        <h2 id="profile-name" class="profile-name-large">Bu Nina</h2>
                        <p id="profile-email-desc"
                            style="font-size: 0.95rem; color: #888888; font-weight: 500; margin-bottom: 4px;">
                            nina@guru.com</p>
                        <span class="badge"
                            style="background-color: rgba(16, 185, 129, 0.1); color: #0918b7; border: 1px solid rgba(16, 185, 129, 0.2); font-weight: 800; font-size: 0.8rem;">Guru</span>
                    </div>
                </div>

                <h3 class="detail-section-title" style="margin-bottom: 16px;">Informasi Pribadi</h3>

                <div class="profile-info-table">
                    <div class="profile-info-row">
                        <span class="profile-info-label">Nama Lengkap</span>
                        <span id="info-fullname" class="profile-info-val">Bu Nina</span>
                    </div>
                    <div class="profile-info-row">
                        <span class="profile-info-label">Username</span>
                        <span id="info-username" class="profile-info-val">nina</span>
                    </div>
                    <div class="profile-info-row">
                        <span class="profile-info-label">Email</span>
                        <span id="info-email" class="profile-info-val">nina@guru.com</span>
                    </div>
                    <div class="profile-info-row">
                        <span class="profile-info-label">Role</span>
                        <span class="profile-info-val">GURU</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="btn-edit-profile" class="btn-profile-edit">Edit Profil</button>
                    <!-- <button id="btn-profile-logout" class="btn-profile-logout">Logout</button> -->
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Profil Modal Overlay -->
    <div id="edit-profile-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 440px;">
            <h3 style="margin-top: 0; margin-bottom: 24px; font-weight: 800; font-size: 1.3rem; color: #000000;">Edit
                Profil</h3>
            <form id="edit-profile-form">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="edit-name" class="form-input" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Username</label>
                    <input type="text" id="edit-username" class="form-input" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label">Email</label>
                    <input type="email" id="edit-email" class="form-input" required>
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Password Baru</label>
                    <input type="password" id="edit-password" class="form-input" placeholder="Kosongkan jika tidak ingin diubah">
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" id="btn-close-modal" class="btn-outline">Batal</button>
                    <button type="submit" class="btn-guru">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/guru/profil.js"></script>
</body>

</html>
