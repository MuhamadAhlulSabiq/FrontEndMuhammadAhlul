<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelas Guru - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/guru/guru-common.css">
    <link rel="stylesheet" href="../../src/css/guru/kelas.css">
</head>

<body class="guru-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 id="page-main-title" style="font-size: 1.65rem; font-weight: 800; color: #111827; margin: 0;">
                        Kelas Saya</h1>
                    <p id="page-main-subtitle"
                        style="font-size: 0.95rem; color: #6b7280; font-weight: 500; margin: 4px 0 0 0;">Kelola semua
                        kelas yang Anda buat.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn" title="Notifikasi">
                        <svg class="bell-icon-svg" viewBox="0 0 24 24">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                    </button>
                    <!-- Silhouette user circle matching mockup -->
                    <div class="user-avatar-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <div class="user-info">
                        <span id="user-display-name">Nina</span>
                        <p id="user-display-role">Guru</p>
                    </div>
                </div>
            </header>

            <!-- Main Panel Container -->
            <div id="kelas-main-panel">
                <!-- Action Button Row -->
                <div class="classes-action-bar">
                    <button id="btn-tambah-kelas" class="btn-buat-kelas">
                        + Buat Kelas
                    </button>
                </div>

                <!-- Class Table Container -->
                <div class="table-responsive-wrapper">
                    <table class="classes-table">
                        <thead>
                            <tr>
                                <th>Mata Pelajaran</th>
                                <th>Kelas</th>
                                <th>Kode Kelas</th>
                                <th>Jumlah Siswa</th>
                            </tr>
                        </thead>
                        <tbody id="classes-table-body">
                            <tr>
                                <td colspan="4" class="loading-state">Memuat daftar kelas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Form Buat Kelas -->
    <div id="modal-kelas" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Buat Kelas Baru</h3>
                <button id="modal-kelas-close" class="modal-close">&times;</button>
            </div>
            <form id="form-tambah-kelas">
                <div class="form-group">
                    <label class="form-label" for="kelas-name">Nama Kelas</label>
                    <input class="form-input" type="text" id="kelas-name" placeholder="Contoh: Matematika kelas 5"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="kelas-desc">Deskripsi Kelas</label>
                    <input class="form-input" type="text" id="kelas-desc"
                        placeholder="Tambahkan deskripsi kelas (optional)">
                </div>

                <div class="form-row-2col">
                    <div class="form-group">
                        <label class="form-label" for="kelas-subject">Mata Pelajaran</label>
                        <input class="form-input" type="text" id="kelas-subject"
                            placeholder="Isi sesuai kelas yang tersedia" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="kelas-date">Tanggal/Kelas</label>
                        <input class="form-input" type="text" id="kelas-date" placeholder="Contoh: Selasa / Kelas 5"
                            required>
                    </div>
                </div>

                <div class="form-row-2col">
                    <div class="form-group">
                        <label class="form-label" for="kelas-academic-year">Tahun Ajaran</label>
                        <input class="form-input" type="text" id="kelas-academic-year" placeholder="2025/2026" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="kelas-display-code">Kode Kelas</label>
                        <input class="form-input" type="text" id="kelas-display-code" value="-Kode otomatis dibuat-"
                            disabled>
                        <p class="form-input-help"
                            style="margin: 4px 0 0 0; font-size: 0.76rem; color: #6b7280; font-weight: 500;">Siswa dapat
                            bergabung menggunakan kode kelas ini</p>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
                    <button type="button" id="btn-cancel-kelas" class="btn-outline">Batal</button>
                    <button type="submit" class="btn-guru">Buat Kelas</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/guru/kelas.js"></script>
</body>

</html>
