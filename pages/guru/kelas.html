<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelas Guru - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/guru/guru-common.css">
    <link rel="stylesheet" href="../../src/css/guru/kelas.css">
</head>
<body class="guru-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 id="page-main-title">Kelas Diampu</h1>
                    <p id="page-main-subtitle">Kelola kelas-kelas aktif yang Anda ajar.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=guru_nina" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Bu Nina</span>
                        <p id="user-display-role">GURU</p>
                    </div>
                </div>
            </header>

            <!-- Main Panel Container -->
            <div id="kelas-main-panel">
                <!-- Toolbar -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                    <h2 class="section-title" style="margin-bottom: 0;">Daftar Kelas</h2>
                    <button id="btn-tambah-kelas" class="btn-guru" style="display: flex; align-items: center; gap: 8px;">
                        <svg style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5;" viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Buat Kelas Baru
                    </button>
                </div>
                
                <!-- Class Grid Container -->
                <section class="class-grid" id="class-grid-container" style="margin-bottom: 48px;">
                    <!-- Loaded dynamically -->
                    <div class="empty-state">Memuat daftar kelas...</div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal Form Buat Kelas -->
    <div id="modal-kelas" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Buat Kelas Baru</h3>
                <button id="modal-kelas-close" class="modal-close">&times;</button>
            </div>
            <form id="form-tambah-kelas">
                <div class="form-group">
                    <label class="form-label" for="kelas-title">Nama Mata Pelajaran</label>
                    <input class="form-input" type="text" id="kelas-title" placeholder="Contoh: Matematika" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="kelas-code">Kode Kelas (Singkat)</label>
                    <input class="form-input" type="text" id="kelas-code" placeholder="Contoh: mtk" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="kelas-subject">Keterangan / Peran</label>
                    <input class="form-input" type="text" id="kelas-subject" placeholder="Contoh: Guru Matematika" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="kelas-illustration">Ilustrasi Kartu</label>
                    <select class="form-select" id="kelas-illustration" required>
                        <option value="chart">Statistik / Grafik (Matematika)</option>
                        <option value="board">Papan Tulis (Bahasa Inggris)</option>
                        <option value="lab">Laboratorium / Sains (IPA)</option>
                        <option value="book">Buku / Sastra (Bahasa Indonesia)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
                    <button type="button" id="btn-cancel-kelas" class="btn-outline">Batal</button>
                    <button type="submit" class="btn-guru">Buat Kelas</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/guru/kelas.js"></script>
</body>
</html>
