<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Guru - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/guru/guru-common.css">
    <link rel="stylesheet" href="../../src/css/guru/materi.css">
</head>
<body class="guru-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1>Materi Pembelajaran</h1>
                    <p>Unggah dan kelola modul belajar siswa.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=guru_nina" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Bu Nina</span>
                        <p id="user-display-role">GURU</p>
                    </div>
                </div>
            </header>

            <!-- Controls (Search + Add) -->
            <section class="controls-row">
                <div class="search-wrapper">
                    <!-- Search Icon SVG -->
                    <svg class="search-icon-svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-materi" class="search-input" placeholder="Cari materi...">
                </div>
                <button id="btn-tambah-materi" class="btn-guru" style="display: flex; align-items: center; gap: 8px;">
                    <svg style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5;" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Unggah Materi
                </button>
            </section>

            <!-- Filter Tabs -->
            <section class="tabs-container" style="margin-bottom: 24px;">
                <button class="tab-btn active" data-subject="semua">Semua Kelas</button>
                <button class="tab-btn" data-subject="mtk">Matematika</button>
                <button class="tab-btn" data-subject="ing">Bahasa Inggris</button>
            </section>

            <!-- List of Materials -->
            <section class="list-container" id="materials-feed">
                <!-- Loaded dynamically -->
                <div class="empty-state">Memuat daftar materi...</div>
            </section>
        </main>
    </div>

    <!-- Modal Form Tambah Materi -->
    <div id="modal-materi" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Unggah Materi Pembelajaran</h3>
                <button id="modal-materi-close" class="modal-close">&times;</button>
            </div>
            <form id="form-tambah-materi">
                <div class="form-group">
                    <label class="form-label" for="materi-title">Judul Materi</label>
                    <input class="form-input" type="text" id="materi-title" placeholder="Masukkan judul materi" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="materi-class">Kelas / Mata Pelajaran</label>
                    <select class="form-select" id="materi-class" required>
                        <option value="mtk">Matematika - Kelas 5</option>
                        <option value="ing">Bahasa Inggris - Kelas 2</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="materi-type">Format Dokumen</label>
                    <select class="form-select" id="materi-type" required>
                        <option value="PDF">PDF Document</option>
                        <option value="PPT">PowerPoint Presentation</option>
                        <option value="DOC">Word Document</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px;">
                    <button type="button" id="btn-cancel-materi" class="btn-outline">Batal</button>
                    <button type="submit" class="btn-guru">Unggah</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/guru/materi.js"></script>
</body>
</html>
