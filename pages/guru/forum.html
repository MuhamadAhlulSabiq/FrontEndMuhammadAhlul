<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Diskusi - E-Learning Platform</title>
    <!-- Role Protection Guard -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/guru/guru-common.css">
    <link rel="stylesheet" href="../../src/css/guru/forum.css">
</head>
<body class="guru-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 id="forum-main-title">Forum Diskusi</h1>
                    <p id="forum-main-subtitle">Kelola dan berpartisipasi dalam diskusi kelas bersama siswa.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=guru_nina" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Bu Nina</span>
                        <p id="user-display-role">GURU</p>
                    </div>
                </div>
            </header>

            <!-- Panel 1: List Diskusi -->
            <div id="forum-list-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                    <!-- Filter Tabs -->
                    <section class="tabs-container" style="margin-bottom: 0;">
                        <button class="tab-btn active" data-tab="semua">Semua Diskusi</button>
                        <button class="tab-btn" data-tab="saya">Diskusi Saya</button>
                    </section>
                    
                    <button id="btn-create-discussion" class="btn-comment-send" style="padding: 12px 24px; border-radius: 8px;">+ Buat Diskusi</button>
                </div>

                <section class="list-container" id="forum-feed">
                    <div class="empty-state">Memuat diskusi kelas...</div>
                </section>
            </div>

            <!-- Panel 2: Buat Diskusi Baru -->
            <div id="forum-create-panel" class="detail-container" style="display: none;">
                <div id="btn-cancel-create-top" class="back-link">
                    <span>&larr;</span> Kembali ke Forum
                </div>
                
                <h2 class="section-title" style="margin-bottom: 28px;">Buat Diskusi Baru</h2>

                <form id="create-discussion-form">
                    <div class="form-row">
                        <label class="form-label">Topik / Judul Diskusi</label>
                        <input type="text" id="discussion-title" class="form-input" placeholder="Masukkan judul diskusi Anda" required>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Pilih Mata Pelajaran</label>
                        <div class="form-select-arrow">
                            <select id="discussion-subject" class="form-select" required>
                                <option value="">-- Pilih Pelajaran --</option>
                                <option value="mtk">Matematika</option>
                                <option value="ing">Bahasa Inggris</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Pilih Kelas</label>
                        <div class="form-select-arrow">
                            <select id="discussion-class" class="form-select" required>
                                <option value="">-- Pilih Kelas --</option>
                                <option value="5">Kelas 5</option>
                                <option value="2">Kelas 2</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="form-label">Isi Diskusi</label>
                        <textarea id="discussion-body" class="form-textarea" placeholder="Tulis pengantar atau topik diskusi di sini..." required></textarea>
                    </div>

                    <div class="form-actions-bottom">
                        <button type="button" id="btn-cancel-create-bottom" class="btn-cancel">Batal</button>
                        <button type="submit" class="btn-comment-send">Publikasikan Diskusi</button>
                    </div>
                </form>
            </div>

            <!-- Panel 3: Detail Diskusi & Balasan -->
            <div id="forum-detail-panel" class="detail-container" style="display: none;">
                <span id="btn-back-to-list" class="back-link">&larr; Kembali ke Forum</span>
                
                <article style="background-color: #f8fafc; padding: 24px; border-radius: 12px; margin-bottom: 32px; border: 1px solid rgba(0, 0, 0, 0.02);">
                    <header class="detail-header" style="margin-bottom: 20px;">
                        <div class="teacher-info-box">
                            <img id="detail-author-avatar" src="" alt="Avatar" class="teacher-avatar">
                            <div>
                                <h4 id="detail-author-name" class="teacher-name">Nama Author</h4>
                                <span id="detail-author-role" class="teacher-subject">Role Author</span>
                            </div>
                        </div>
                        <span id="detail-post-time" class="comment-time">Waktu</span>
                    </header>
                    <h2 id="detail-post-title" class="section-title" style="margin-bottom: 12px; font-size: 1.5rem;">Judul Postingan</h2>
                    <p id="detail-post-body" class="detail-body-text">Isi postingan diskusi...</p>
                </article>

                <h3 class="section-title" style="font-size: 1.15rem;">Balasan Diskusi</h3>
                
                <!-- Balasan List -->
                <div id="comments-list-box" class="comments-container">
                    <!-- Dynamic comments list -->
                </div>

                <!-- Kirim Balasan Box -->
                <form id="comment-post-form" class="comment-input-area">
                    <input type="text" id="comment-text-input" class="comment-textarea" placeholder="Tulis tanggapan atau jawaban Anda disini..." required>
                    <button type="submit" class="btn-comment-send">Kirim Balasan</button>
                </form>
            </div>
        </main>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/guru/forum.js"></script>
</body>
</html>
