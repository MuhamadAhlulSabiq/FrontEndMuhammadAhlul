<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - E-Learning Platform</title>
    <!-- Role Protection Guard (Simulasi) -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/siswa/siswa-common.css">
    <link rel="stylesheet" href="../../src/css/siswa/profil.css">
</head>
<body class="siswa-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1>Profil Saya</h1>
                    <p>Kelola detail informasi profil akademis Anda.</p>
                </div>
            </header>

            <!-- Profil View Card -->
            <section style="max-width: 720px; animation: fadeIn 0.4s ease;">
                <div class="profile-avatar-container">
                    <img id="profile-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=siswa" alt="User Profile Image" class="profile-avatar-large" style="background-color: #3b82f6;">
                    <div>
                        <h2 id="profile-name" class="profile-name-large">-</h2>
                        <p id="profile-email-desc" style="font-size: 0.95rem; color: #888888; font-weight: 500; margin-bottom: 4px;">-</p>
                        <span class="badge" style="background-color: rgba(21, 82, 198, 0.1); color: #1552C6; border: 1px solid rgba(21, 82, 198, 0.2); font-weight: 800; font-size: 0.8rem;">Siswa</span>
                    </div>
                </div>

                <h3 class="detail-section-title" style="margin-bottom: 16px;">Informasi Pribadi</h3>
                
                <div class="profile-info-table">
                    <div class="profile-info-row">
                        <span class="profile-info-label">Nama Lengkap</span>
                        <span id="info-fullname" class="profile-info-val">-</span>
                    </div>
                    <div class="profile-info-row">
                        <span class="profile-info-label">Username</span>
                        <span id="info-username" class="profile-info-val">-</span>
                    </div>
                    <div class="profile-info-row">
                        <span class="profile-info-label">Email</span>
                        <span id="info-email" class="profile-info-val">-</span>
                    </div>
                    <div class="profile-info-row">
                        <span class="profile-info-label">Kelas</span>
                        <span id="info-class" class="profile-info-val">-</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button class="btn-profile-edit">Edit Profil</button>
                    <button id="btn-profile-logout" class="btn-profile-logout">Logout</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Profil Modal Overlay -->
    <div id="edit-profile-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease;">
        <div style="background: white; padding: 32px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); box-sizing: border-box;">
            <h3 style="margin-top: 0; margin-bottom: 24px; font-weight: 800; font-size: 1.3rem; color: #000000;">Edit Profil</h3>
            <form id="edit-profile-form">
                <div class="form-group" style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
                    <label class="form-label" style="font-weight: 700; color: #111827; font-size: 0.95rem;">Nama Lengkap</label>
                    <input type="text" id="edit-name" class="gabung-input" style="padding: 10px 12px; font-size: 1rem; font-weight: 500; border: 1px solid #cbd5e1;" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
                    <label class="form-label" style="font-weight: 700; color: #111827; font-size: 0.95rem;">Username</label>
                    <input type="text" id="edit-username" class="gabung-input" style="padding: 10px 12px; font-size: 1rem; font-weight: 500; border: 1px solid #cbd5e1;" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
                    <label class="form-label" style="font-weight: 700; color: #111827; font-size: 0.95rem;">Email</label>
                    <input type="email" id="edit-email" class="gabung-input" style="padding: 10px 12px; font-size: 1rem; font-weight: 500; border: 1px solid #cbd5e1;" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
                    <label class="form-label" style="font-weight: 700; color: #111827; font-size: 0.95rem;">Kelas</label>
                    <input type="text" id="edit-class" class="gabung-input" style="padding: 10px 12px; font-size: 1rem; font-weight: 500; border: 1px solid #cbd5e1;" required>
                </div>
                <div class="form-group" style="margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px;">
                    <label class="form-label" style="font-weight: 700; color: #111827; font-size: 0.95rem;">Password Baru</label>
                    <input type="password" id="edit-password" class="gabung-input" style="padding: 10px 12px; font-size: 1rem; font-weight: 500; border: 1px solid #cbd5e1;" placeholder="Kosongkan jika tidak ingin diubah">
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" id="btn-close-modal" style="background: #e2e8f0; color: #475569; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit;">Batal</button>
                    <button type="submit" style="background: #1552C6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/siswa/profil.js"></script>
</body>
</html>
