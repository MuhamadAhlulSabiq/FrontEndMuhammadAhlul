<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelas Saya - E-Learning Platform</title>
    <!-- Role Protection Guard (Simulasi) -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/siswa/siswa-common.css">
    <link rel="stylesheet" href="../../src/css/siswa/kelas.css">
</head>
<body class="siswa-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 id="page-main-title">Kelas Saya</h1>
                    <p id="page-main-subtitle">Daftar kelas aktif yang Anda ikuti.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=siswa" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Rohmat</span>
                        <p id="user-display-role">Siswa</p>
                    </div>
                </div>
            </header>

            <!-- Main Panel Container -->
            <div id="kelas-main-panel">
                <!-- Toggleable Gabung Kelas Area (seperti Gabung Kelas.jpg) -->
                <section class="gabung-kelas-box" style="display: none; animation: fadeIn 0.3s ease;">
                    <h2 class="gabung-kelas-title">Gabung Kelas</h2>
                    <p class="gabung-kelas-desc">Masukkan kode kelas yang diberikan oleh guru Anda untuk bergabung ke dalam kelas.</p>
                    
                    <form id="join-class-form" class="gabung-kelas-form">
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label class="form-label" style="font-size: 1.05rem; font-weight: 800; color: #000000;">Kode kelas</label>
                            <input type="text" id="class-code-input" class="gabung-input" placeholder="Contoh: F972MF19" required>
                        </div>
                        <button type="submit" class="btn-gabung">Gabung Kelas</button>
                    </form>
                </section>

                <!-- Daftar Kelas Saya Header/Toolbar -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 class="section-title" style="margin-bottom: 0;">Kelas Saya</h2>
                    <button id="btn-toggle-join-class" style="background-color: #1552C6; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif;">
                        <svg style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5;" viewBox="0 0 24 24">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Gabung Kelas Baru
                    </button>
                </div>
                <section class="class-grid" id="class-grid-container" style="margin-bottom: 48px;">
                    <!-- Matematika -->
                    <div class="class-card">
                        <div class="class-card-header">
                            <h3 class="class-card-title">Matematika</h3>
                        </div>
                        <div class="class-card-illustration">
                            <!-- Blue bar chart with upward arrow SVG -->
                            <svg viewBox="0 0 200 120" width="100%" height="100%">
                                <rect x="20" y="80" width="16" height="30" fill="#93c5fd" rx="2"/>
                                <rect x="44" y="65" width="16" height="45" fill="#60a5fa" rx="2"/>
                                <rect x="68" y="50" width="16" height="60" fill="#3b82f6" rx="2"/>
                                <rect x="92" y="35" width="16" height="75" fill="#2563eb" rx="2"/>
                                <rect x="116" y="20" width="16" height="90" fill="#1d4ed8" rx="2"/>
                                <rect x="140" y="5" width="16" height="105" fill="#1e3a8a" rx="2"/>
                                <!-- Upward arrow line -->
                                <path d="M22 90 L 52 70 L 82 55 L 112 30 L 148 10" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                                <path d="M138 10 L 148 10 L 148 20" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Bahasa Inggris -->
                    <div class="class-card">
                        <div class="class-card-header">
                            <h3 class="class-card-title">Bahasa Inggris</h3>
                        </div>
                        <div class="class-card-illustration">
                            <!-- Female teacher SVG -->
                            <svg viewBox="0 0 200 120" width="100%" height="100%">
                                <!-- Classroom Blackboard -->
                                <rect x="10" y="10" width="120" height="70" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                                <rect x="15" y="15" width="110" height="60" fill="#1e3a8a"/>
                                <line x1="12" y1="80" x2="128" y2="80" stroke="#cbd5e1" stroke-width="3"/>
                                <!-- Desk and clock on blackboard -->
                                <circle cx="110" cy="30" r="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
                                <rect x="25" y="45" width="40" height="25" fill="#fef08a" opacity="0.1"/>
                                <!-- Female teacher -->
                                <path d="M140 110c3-18 12-25 24-25s21 7 24 25z" fill="#f43f5e"/> <!-- Red dress -->
                                <circle cx="164" cy="74" r="10" fill="#fee2e2"/> <!-- Head -->
                                <path d="M152 70c2-7 8-10 15-8s10 8 7 15z" fill="#1e1b4b"/> <!-- Hair -->
                                <line x1="152" y1="90" x2="125" y2="65" stroke="#fee2e2" stroke-width="3" stroke-linecap="round"/> <!-- Pointer Arm -->
                                <line x1="125" y1="65" x2="98" y2="45" stroke="#d97706" stroke-width="2" stroke-linecap="round"/> <!-- Pointer stick -->
                            </svg>
                        </div>
                    </div>
                </section>

                <!-- Aktivitas Terbaru -->
                <h2 class="section-title">Aktivitas Terbaru</h2>
                <section class="list-container" id="recent-classroom-activities">
                    <!-- Loaded dynamically -->
                    <div class="empty-state">Memuat aktivitas kelas...</div>
                </section>
            </div>

            <!-- Success Panel (seperti Berhasil Gabung Kelas.jpg) -->
            <div id="kelas-success-panel" class="success-screen" style="display: none;">
                <div class="success-circle">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h2 class="success-title">Berhasil Bergabung!</h2>
                <p class="success-desc">Anda telah berhasil bergabung.</p>
                <button id="btn-success-back" class="btn-action-primary">Lihat Kelas Saya</button>
            </div>
        </main>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/siswa/kelas.js"></script>
</body>
</html>
