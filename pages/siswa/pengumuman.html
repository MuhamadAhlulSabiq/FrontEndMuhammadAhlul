<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman - E-Learning Platform</title>
    <!-- Role Protection Guard (Simulasi) -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/roles/siswa.css">
</head>
<body class="siswa-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <svg class="logo-icon-svg" viewBox="0 0 24 24">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                    <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
                </svg>
                <span class="logo-text">E-Learning<br>Platform</span>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9" rx="1"/>
                        <rect x="14" y="3" width="7" height="5" rx="1"/>
                        <rect x="3" y="16" width="7" height="5" rx="1"/>
                        <rect x="14" y="12" width="7" height="9" rx="1"/>
                    </svg>
                    Dashboard
                </a>
                <a href="kelas.html" class="menu-item">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                    Kelas Saya
                </a>
                <a href="materi.html" class="menu-item">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M8 16V8l4 4 4-4v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                    Materi
                </a>
                <a href="tugas.html" class="menu-item">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M16 2v4M8 2v4M12 11h4M8 11h2M12 15h4M8 15h2"/>
                    </svg>
                    Tugas
                </a>
                <a href="forum.html" class="menu-item">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    Forum Diskusi
                </a>
                <a href="pengumuman.html" class="menu-item active">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <path d="M12 7V3H2v18h20V7H12zm0 12H4V9h8v10zm8 0h-6v-6h6v6zm0-8h-6V9h6v2z"/>
                    </svg>
                    Pengumuman
                </a>
                <a href="profil.html" class="menu-item">
                    <svg class="menu-icon-svg" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Profil
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="btn-logout" class="btn-logout">
                    <svg style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; margin-right: 8px;" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                    Keluar
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1>Pengumuman</h1>
                    <p>Informasi terbaru dari sekolah, guru, dan kelas Anda.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=siswa" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">Rohmat</span>
                        <p id="user-display-role">Siswa</p>
                    </div>
                </div>
            </header>

            <!-- Search Bar -->
            <section class="search-container">
                <div class="search-input-wrapper">
                    <!-- Search Icon SVG -->
                    <svg class="search-icon-svg" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-announcement" class="search-input" placeholder="Cari pengumuman...">
                </div>
            </section>

            <!-- Announcements Log List -->
            <section class="list-container" id="announcements-feed">
                <!-- Loaded dynamically -->
                <div class="empty-state">Memuat pengumuman...</div>
            </section>
        </main>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/siswa/pengumuman.js"></script>
</body>
</html>
