<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi - E-Learning Platform</title>
    <!-- Role Protection Guard (Simulasi) -->
    <script src="../../src/js/middleware/auth-guard.js"></script>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="../../src/css/global.css">
    <link rel="stylesheet" href="../../src/css/components.css">
    <link rel="stylesheet" href="../../src/css/main.css">
    <link rel="stylesheet" href="../../src/css/siswa/siswa-common.css">
    <link rel="stylesheet" href="../../src/css/siswa/materi.css">
</head>
<body class="siswa-theme">
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1>Materi</h1>
                    <p>Daftar modul pembelajaran dan materi referensi Anda.</p>
                </div>
                <div class="user-profile">
                    <button class="bell-icon-btn">
                        <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>
                        </svg>
                    </button>
                    <img id="user-avatar" src="https://api.dicebear.com/7.x/adventurer/svg?seed=siswa" alt="Avatar" class="avatar">
                    <div class="user-info">
                        <span id="user-display-name">-</span>
                        <p id="user-display-role">Siswa</p>
                    </div>
                </div>
            </header>

            <!-- Filter Tabs -->
            <section class="tabs-container">
                <button class="tab-btn active" data-subject="semua">Semua</button>
                <button class="tab-btn" data-subject="mtk">Matematika</button>
                <button class="tab-btn" data-subject="ing">Bahasa Inggris</button>
            </section>

            <!-- List of Materials -->
            <section class="list-container" id="materials-feed">
                <!-- Loaded dynamically -->
                <div class="empty-state">Memuat daftar materi...</div>
            </section>
        </main>
    </div>

    <!-- JS Separated Controller -->
    <script type="module" src="../../src/js/views/siswa/materi.js"></script>
</body>
</html>
